<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stillwater — a place to be still</title>
    <meta name="description" content="A serene moonlit lake for meditation, with immersive journeys of light and sacred geometry. Free in any browser and in VR headsets." />
    <meta name="theme-color" content="#02030a" />
    <link rel="canonical" href="https://drdeas.github.io/stillwater-vr/" />

    <!-- Link previews: Open Graph (Facebook, LinkedIn, Slack, iMessage, WhatsApp, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stillwater" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://drdeas.github.io/stillwater-vr/" />
    <meta property="og:title" content="Stillwater — a place to be still" />
    <meta property="og:description" content="A serene moonlit lake for meditation, with immersive journeys of light and sacred geometry. Free in any browser and in VR headsets." />
    <meta property="og:image" content="https://drdeas.github.io/stillwater-vr/assets/social/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://drdeas.github.io/stillwater-vr/assets/social/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A moonlit lake reflecting snowy mountains, an aurora and a blossom tree, with the title Stillwater" />
    <meta property="og:image" content="https://drdeas.github.io/stillwater-vr/assets/social/og-image-square.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="A moonlit lake reflecting snowy mountains, an aurora and a blossom tree, with the title Stillwater" />

    <!-- Link previews: X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stillwater — a place to be still" />
    <meta name="twitter:description" content="A serene moonlit lake for meditation, with immersive journeys of light and sacred geometry. Free in any browser and in VR headsets." />
    <meta name="twitter:image" content="https://drdeas.github.io/stillwater-vr/assets/social/og-image.jpg" />
    <meta name="twitter:image:alt" content="A moonlit lake reflecting snowy mountains, an aurora and a blossom tree, with the title Stillwater" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
  </head>
  <body>
    <div id="stage" aria-label="Moonlit lake scene"></div>

    <section id="intro">
      <div class="intro-card">
        <p class="eyebrow">a place to be still</p>
        <h1>Stillwater</h1>
        <p class="lede">A moonlit lake, a stone circle, a blossom tree. Stay as long as you like.</p>
        <div class="intro-actions">
          <button id="begin" class="primary" type="button">Begin</button>
          <button class="ghost" type="button" data-enter-vr hidden>Enter VR</button>
        </div>
        <p id="vr-note" class="note"></p>
      </div>
    </section>

    <nav id="hud" class="hidden" aria-label="Settings">
      <div class="group wide">
        <span class="label">Scene</span>
        <div id="scenes" class="chips"></div>
      </div>
      <div class="group">
        <span class="label">Soundscape</span>
        <div id="soundscapes" class="chips"></div>
      </div>
      <div class="group">
        <label class="label" for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="100" step="1" />
      </div>
      <div class="group">
        <button id="breath" class="chip lake-only" type="button" aria-pressed="false">Breathing guide</button>
        <button id="reaim" class="chip journey-only" type="button" title="Point the journey where you are looking: forward, or straight up if you are lying down">Re-aim path</button>
        <button class="chip accent" type="button" data-enter-vr hidden>Enter VR</button>
      </div>
      <p class="hint"><span class="lake-only">Drag to look around · W A S D to drift across the water</span><span class="journey-only">The journey follows your gaze · look up and press Re-aim path to rise instead</span></p>
    </nav>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
